<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas y Actividades Personal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-full flex flex-col transition-colors duration-200">

    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-brand-500 text-white rounded-xl shadow-md">
                    <i class="fa-solid fa-list-check text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">TaskManager Pro</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Gestor Personal & Google Sync</p>
                </div>
            </div>

            <div class="flex items-center space-x-2 sm:space-x-4">
                <button id="btn-weekly-alert" class="relative p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors" title="Alertas Semanales">
                    <i class="fa-regular fa-bell text-xl"></i>
                    <span id="alert-badge" class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-rose-500 rounded-full ring-2 ring-white dark:ring-slate-800"></span>
                </button>

                <button id="btn-theme-toggle" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors">
                    <i class="fa-solid fa-moon dark:hidden text-xl"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-xl"></i>
                </button>

                <button id="btn-open-modal" class="bg-brand-500 hover:bg-brand-600 text-white px-3 sm:px-4 py-2 rounded-xl text-sm font-medium transition-all shadow-sm flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">Nueva Tarea</span>
                </button>
            </div>
        </div>
    </header>

    <div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row gap-6">
        
        <!-- Sidebar Filters -->
        <aside class="w-full md:w-64 shrink-0 space-y-6">
            <!-- Alert Banner for Overdue Tasks -->
            <div id="overdue-banner" class="hidden bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 rounded-2xl p-4 text-rose-800 dark:text-rose-200">
                <div class="flex items-start space-x-3">
                    <i class="fa-solid fa-triangle-exclamation text-rose-500 text-lg mt-0.5"></i>
                    <div class="flex-1 text-xs">
                        <span class="font-bold block text-sm">Tareas Retrasadas</span>
                        <p class="mt-0.5"><span id="overdue-count">0</span> tarea(s) han superado la fecha límite.</p>
                        <button onclick="filterByOverdue()" class="mt-2 underline font-semibold hover:text-rose-600">Ver pendientes</button>
                    </div>
                </div>
            </div>

            <!-- Categories / Projects -->
            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Categorías</h3>
                <nav class="space-y-1" id="category-filters">
                    <button data-category="all" class="filter-cat-btn w-full flex items-center justify-between px-3 py-2 text-sm font-medium rounded-xl bg-brand-50 dark:bg-slate-700 text-brand-600 dark:text-brand-100">
                        <span class="flex items-center space-x-2">
                            <i class="fa-solid fa-layer-group text-slate-400"></i>
                            <span>Todas</span>
                        </span>
                        <span id="count-all" class="text-xs bg-white dark:bg-slate-800 px-2 py-0.5 rounded-full font-semibold border">0</span>
                    </button>
                    <button data-category="casa" class="filter-cat-btn w-full flex items-center justify-between px-3 py-2 text-sm font-medium rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50">
                        <span class="flex items-center space-x-2">
                            <i class="fa-solid fa-house text-amber-500"></i>
                            <span>Tareas de la Casa</span>
                        </span>
                        <span id="count-casa" class="text-xs bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded-full">0</span>
                    </button>
                    <button data-category="familia" class="filter-cat-btn w-full flex items-center justify-between px-3 py-2 text-sm font-medium rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50">
                        <span class="flex items-center space-x-2">
                            <i class="fa-solid fa-people-group text-emerald-500"></i>
                            <span>Tareas de la Familia</span>
                        </span>
                        <span id="count-familia" class="text-xs bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded-full">0</span>
                    </button>
                    <button data-category="verbena" class="filter-cat-btn w-full flex items-center justify-between px-3 py-2 text-sm font-medium rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50">
                        <span class="flex items-center space-x-2">
                            <i class="fa-solid fa-champagne-glasses text-purple-500"></i>
                            <span>Tareas para Verbena</span>
                        </span>
                        <span id="count-verbena" class="text-xs bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded-full">0</span>
                    </button>
                    <button data-category="mascotas" class="filter-cat-btn w-full flex items-center justify-between px-3 py-2 text-sm font-medium rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50">
                        <span class="flex items-center space-x-2">
                            <i class="fa-solid fa-paw text-blue-500"></i>
                            <span>Tareas de Mascotas</span>
                        </span>
                        <span id="count-mascotas" class="text-xs bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded-full">0</span>
                    </button>
                </nav>
            </div>

            <!-- Export & Sync Tools -->
            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Sincronización</h3>
                <button onclick="exportToICS()" class="w-full text-left px-3 py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-xl flex items-center space-x-2 border border-slate-200 dark:border-slate-700">
                    <i class="fa-solid fa-calendar-arrow-down text-brand-500"></i>
                    <span>Exportar a iCal (.ics)</span>
                </button>
                <button onclick="exportToGoogleTasksJSON()" class="w-full text-left px-3 py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-xl flex items-center space-x-2 border border-slate-200 dark:border-slate-700">
                    <i class="fa-solid fa-file-export text-emerald-500"></i>
                    <span>Exportar Datos (Google Tasks)</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col space-y-4 min-w-0">
            <!-- View Selector Tabs & Search Bar -->
            <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
                <div class="flex items-center bg-slate-100 dark:bg-slate-900 p-1 rounded-xl w-full sm:w-auto overflow-x-auto">
                    <button data-view="kanban" class="view-btn px-4 py-1.5 text-xs font-semibold rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm">
                        <i class="fa-solid fa-kanban-board mr-1.5"></i>Tablero
                    </button>
                    <button data-view="day" class="view-btn px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700">
                        Día
                    </button>
                    <button data-view="month" class="view-btn px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700">
                        Mes
                    </button>
                    <button data-view="year" class="view-btn px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700">
                        Año
                    </button>
                </div>

                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input type="text" id="search-input" placeholder="Buscar tarea..." class="w-full pl-8 pr-3 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
            </div>

            <!-- View 1: KANBAN TRACKER -->
            <div id="view-kanban" class="grid grid-cols-1 md:grid-cols-3 gap-4 flex-1">
                <!-- Column: Por Iniciar -->
                <div class="bg-slate-100/70 dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-700/60 flex flex-col">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="font-bold text-xs uppercase tracking-wider text-slate-500 dark:text-slate-400 flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                            <span>Por iniciar</span>
                        </h2>
                        <span id="badge-por-iniciar" class="text-xs bg-slate-200 dark:bg-slate-700 px-2 py-0.5 rounded-full font-semibold">0</span>
                    </div>
                    <div id="col-por-iniciar" class="task-container flex-1 space-y-3 min-h-[200px] custom-scrollbar overflow-y-auto"></div>
                </div>

                <!-- Column: En Proceso -->
                <div class="bg-slate-100/70 dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-700/60 flex flex-col">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="font-bold text-xs uppercase tracking-wider text-amber-600 dark:text-amber-400 flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                            <span>En proceso</span>
                        </h2>
                        <span id="badge-en-proceso" class="text-xs bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 px-2 py-0.5 rounded-full font-semibold">0</span>
                    </div>
                    <div id="col-en-proceso" class="task-container flex-1 space-y-3 min-h-[200px] custom-scrollbar overflow-y-auto"></div>
                </div>

                <!-- Column: Terminada -->
                <div class="bg-slate-100/70 dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-700/60 flex flex-col">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="font-bold text-xs uppercase tracking-wider text-emerald-600 dark:text-emerald-400 flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                            <span>Terminada</span>
                        </h2>
                        <span id="badge-terminada" class="text-xs bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 px-2 py-0.5 rounded-full font-semibold">0</span>
                    </div>
                    <div id="col-terminada" class="task-container flex-1 space-y-3 min-h-[200px] custom-scrollbar overflow-y-auto"></div>
                </div>
            </div>

            <div id="view-calendar" class="hidden bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex-1 flex flex-col">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center space-x-3">
                        <button id="cal-prev" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg"><i class="fa-solid fa-chevron-left"></i></button>
                        <h2 id="cal-title" class="text-base font-bold">Octubre 2026</h2>
                        <button id="cal-next" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    <button id="cal-today" class="text-xs px-3 py-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 rounded-lg font-medium">Hoy</button>
                </div>
                <div id="cal-content" class="flex-1 min-h-[350px]"></div>
            </div>
        </main>
    </div>

    <div id="task-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3">
                <h3 id="modal-title" class="font-bold text-lg">Nueva Tarea</h3>
                <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <form id="task-form" class="space-y-4">
                <input type="hidden" id="task-id">

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Título de la actividad *</label>
                    <input type="text" id="form-title" required placeholder="Ej. Comprar alimento para perro" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Categoría</label>
                        <select id="form-category" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            <option value="casa">🏠 Casa</option>
                            <option value="familia">👨‍👩‍👧‍👦 Familia</option>
                            <option value="verbena">🎪 Verbena</option>
                            <option value="mascotas">🐾 Mascotas</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Estado Tracker</label>
                        <select id="form-status" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            <option value="por-iniciar">Por iniciar</option>
                            <option value="en-proceso">En proceso</option>
                            <option value="terminada">Terminada</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Fecha Límite</label>
                        <input type="date" id="form-date" required class="w-full px-2 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Prioridad</label>
                        <select id="form-priority" class="w-full px-2 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            <option value="P1">P1 (Alta)</option>
                            <option value="P2">P2 (Media-Alta)</option>
                            <option value="P3">P3 (Media)</option>
                            <option value="P4">P4 (Baja)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Urgencia</label>
                        <select id="form-urgency" class="w-full px-2 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            <option value="Alta">Alta</option>
                            <option value="Media">Media</option>
                            <option value="Baja">Baja</option>
                        </select>
                    </div>
                </div>

                <!-- Subtasks Builder -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Subtareas / Pasos</label>
                    <div class="flex space-x-2 mb-2">
                        <input type="text" id="subtask-input" placeholder="Añadir paso..." class="flex-1 px-3 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none">
                        <button type="button" id="btn-add-subtask" class="px-3 py-1.5 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 text-xs font-semibold rounded-xl">Añadir</button>
                    </div>
                    <ul id="subtasks-list" class="space-y-1.5 max-h-32 overflow-y-auto custom-scrollbar"></ul>
                </div>

                <div class="flex justify-end space-x-3 pt-3 border-t border-slate-200 dark:border-slate-700">
                    <button type="button" id="btn-cancel-modal" class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl">Cancelar</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold bg-brand-500 hover:bg-brand-600 text-white rounded-xl shadow-sm">Guardar Tarea</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Default Initial Data Setup
        let tasks = JSON.parse(localStorage.getItem('taskmanager_tasks')) || [
            {
                id: '1',
                title: 'Limpieza profunda de la cocina',
                category: 'casa',
                status: 'en-proceso',
                date: new Date(Date.now() + 86400000).toISOString().split('T')[0],
                priority: 'P2',
                urgency: 'Media',
                subtasks: [
                    { title: 'Limpiar refrigerador', completed: true },
                    { title: 'Organizar despensa', completed: false }
                ]
            },
            {
                id: '2',
                title: 'Comprar boletos para festival verbena',
                category: 'verbena',
                status: 'por-iniciar',
                date: new Date(Date.now() - 86400000).toISOString().split('T')[0], // Overdue
                priority: 'P1',
                urgency: 'Alta',
                subtasks: []
            },
            {
                id: '3',
                title: 'Llevar a Firulais al veterinario',
                category: 'mascotas',
                status: 'por-iniciar',
                date: new Date().toISOString().split('T')[0],
                priority: 'P1',
                urgency: 'Alta',
                subtasks: [{ title: 'Vacuna anual', completed: false }]
            }
        ];

        let currentCategory = 'all';
        let currentView = 'kanban';
        let calendarDate = new Date();
        let tempSubtasks = [];

        // Save State
        function saveState() {
            localStorage.setItem('taskmanager_tasks', JSON.stringify(tasks));
            render();
        }

        // Theme Toggle
        const themeBtn = document.getElementById('btn-theme-toggle');
        themeBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        // Render Controller
        function render() {
            updateCountsAndAlerts();
            if (currentView === 'kanban') {
                document.getElementById('view-kanban').classList.remove('hidden');
                document.getElementById('view-calendar').classList.add('hidden');
                renderKanban();
            } else {
                document.getElementById('view-kanban').classList.add('hidden');
                document.getElementById('view-calendar').classList.remove('hidden');
                renderCalendar();
            }
        }

        // Filter Logic
        function getFilteredTasks() {
            const query = document.getElementById('search-input').value.toLowerCase();
            return tasks.filter(task => {
                const matchesCat = currentCategory === 'all' || task.category === currentCategory;
                const matchesSearch = task.title.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
        }

        function updateCountsAndAlerts() {
            const todayStr = new Date().toISOString().split('T')[0];
            let overdueCount = 0;

            const counts = { all: 0, casa: 0, familia: 0, verbena: 0, mascotas: 0 };

            tasks.forEach(task => {
                counts.all++;
                if (counts[task.category] !== undefined) counts[task.category]++;

                if (task.date < todayStr && task.status !== 'terminada') {
                    overdueCount++;
                }
            });

            // Update UI Counters
            Object.keys(counts).forEach(cat => {
                const badge = document.getElementById(`count-${cat}`);
                if (badge) badge.textContent = counts[cat];
            });

            const overdueBanner = document.getElementById('overdue-banner');
            const alertBadge = document.getElementById('alert-badge');
            document.getElementById('overdue-count').textContent = overdueCount;

            if (overdueCount > 0) {
                overdueBanner.classList.remove('hidden');
                alertBadge.classList.remove('hidden');
            } else {
                overdueBanner.classList.add('hidden');
                alertBadge.classList.add('hidden');
            }
        }

        // Category Buttons
        document.querySelectorAll('.filter-cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-cat-btn').forEach(b => {
                    b.classList.remove('bg-brand-50', 'dark:bg-slate-700', 'text-brand-600', 'dark:text-brand-100');
                    b.classList.add('text-slate-600', 'dark:text-slate-300');
                });
                btn.classList.add('bg-brand-50', 'dark:bg-slate-700', 'text-brand-600', 'dark:text-brand-100');
                currentCategory = btn.dataset.category;
                render();
            });
        });

        // View Tabs Toggle
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(b => {
                    b.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-800', 'dark:text-slate-100', 'shadow-sm');
                    b.classList.add('text-slate-500', 'dark:text-slate-400');
                });
                btn.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-800', 'dark:text-slate-100', 'shadow-sm');
                currentView = btn.dataset.view;
                render();
            });
        });

        // Search Input
        document.getElementById('search-input').addEventListener('input', render);

        function renderKanban() {
            const filtered = getFilteredTasks();
            const cols = {
                'por-iniciar': document.getElementById('col-por-iniciar'),
                'en-proceso': document.getElementById('col-en-proceso'),
                'terminada': document.getElementById('col-terminada')
            };

            Object.keys(cols).forEach(key => cols[key].innerHTML = '');

            const statusCounts = { 'por-iniciar': 0, 'en-proceso': 0, 'terminada': 0 };

            filtered.forEach(task => {
                statusCounts[task.status]++;
                const card = createCardElement(task);
                cols[task.status].appendChild(card);
            });

            document.getElementById('badge-por-iniciar').textContent = statusCounts['por-iniciar'];
            document.getElementById('badge-en-proceso').textContent = statusCounts['en-proceso'];
            document.getElementById('badge-terminada').textContent = statusCounts['terminada'];
        }

        function createCardElement(task) {
            const el = document.createElement('div');
            const todayStr = new Date().toISOString().split('T')[0];
            const isOverdue = task.date < todayStr && task.status !== 'terminada';

            const subtaskCompleted = task.subtasks.filter(s => s.completed).length;
            const subtaskTotal = task.subtasks.length;
            const subtaskProgress = subtaskTotal > 0 ? Math.round((subtaskCompleted / subtaskTotal) * 100) : 0;

            const categoryIcons = {
                casa: 'fa-house text-amber-500',
                familia: 'fa-people-group text-emerald-500',
                verbena: 'fa-champagne-glasses text-purple-500',
                mascotas: 'fa-paw text-blue-500'
            };

            const gCalUrl = generateGoogleCalendarUrl(task);

            el.className = `bg-white dark:bg-slate-800 p-4 rounded-xl border ${isOverdue ? 'border-rose-400 dark:border-rose-600 ring-1 ring-rose-400' : 'border-slate-200 dark:border-slate-700'} shadow-sm space-y-3 relative group`;
            
            el.innerHTML = `
                <div class="flex items-start justify-between">
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 flex items-center space-x-1.5">
                        <i class="fa-solid ${categoryIcons[task.category]} text-xs"></i>
                        <span class="capitalize">${task.category}</span>
                    </span>
                    <div class="flex items-center space-x-1 text-xs">
                        <span class="px-1.5 py-0.5 rounded font-bold ${task.priority === 'P1' ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300' : 'bg-slate-100 dark:bg-slate-700'}">${task.priority}</span>
                        <span class="text-slate-400">| ${task.urgency}</span>
                    </div>
                </div>

                <div>
                    <h4 class="font-semibold text-sm ${task.status === 'terminada' ? 'line-through text-slate-400' : ''}">${task.title}</h4>
                    <p class="text-xs ${isOverdue ? 'text-rose-500 font-bold' : 'text-slate-400'} mt-1 flex items-center">
                        <i class="fa-regular fa-calendar mr-1"></i> ${task.date} ${isOverdue ? '(Atrasada)' : ''}
                    </p>
                </div>

                ${subtaskTotal > 0 ? `
                    <div class="space-y-1">
                        <div class="flex justify-between text-[10px] text-slate-400 font-medium">
                            <span>Pasos (${subtaskCompleted}/${subtaskTotal})</span>
                            <span>${subtaskProgress}%</span>
                        </div>
                        <div class="w-full bg-slate-100 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                            <div class="bg-brand-500 h-full" style="width: ${subtaskProgress}%"></div>
                        </div>
                    </div>
                ` : ''}

                <div class="pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between text-xs">
                    <a href="${gCalUrl}" target="_blank" rel="noopener noreferrer" class="text-brand-600 dark:text-brand-400 hover:underline flex items-center space-x-1" title="Añadir a Google Calendar">
                        <i class="fa-solid fa-calendar-plus"></i>
                        <span class="text-[11px]">G-Calendar</span>
                    </a>
                    
                    <div class="flex items-center space-x-2">
                        <button onclick="editTask('${task.id}')" class="text-slate-400 hover:text-brand-500 p-1"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteTask('${task.id}')" class="text-slate-400 hover:text-rose-500 p-1"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `;
            return el;
        }

        function renderCalendar() {
            const calContent = document.getElementById('cal-content');
            const calTitle = document.getElementById('cal-title');
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();

            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            if (currentView === 'month') {
                calTitle.textContent = `${monthNames[month]} ${year}`;
                renderMonthView(calContent, year, month);
            } else if (currentView === 'day') {
                calTitle.textContent = `${calendarDate.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}`;
                renderDayView(calContent, calendarDate);
            } else if (currentView === 'year') {
                calTitle.textContent = `Año ${year}`;
                renderYearView(calContent, year);
            }
        }

        function renderMonthView(container, year, month) {
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const filteredTasks = getFilteredTasks();

            let html = `
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-slate-400 mb-2">
                    <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
                </div>
                <div class="grid grid-cols-7 gap-1 flex-1">
            `;

            for (let i = 0; i < firstDay; i++) {
                html += `<div class="bg-slate-50/50 dark:bg-slate-900/30 rounded-lg h-20 sm:h-24"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayTasks = filteredTasks.filter(t => t.date === dateStr);

                html += `
                    <div class="bg-slate-50 dark:bg-slate-900/60 p-1.5 rounded-lg border border-slate-100 dark:border-slate-800 h-20 sm:h-24 overflow-y-auto custom-scrollbar">
                        <span class="text-xs font-semibold block mb-1 ${day === new Date().getDate() && month === new Date().getMonth() ? 'text-brand-500 font-bold' : 'text-slate-400'}">${day}</span>
                        <div class="space-y-1">
                            ${dayTasks.map(t => `
                                <div onclick="editTask('${t.id}')" class="cursor-pointer text-[10px] p-1 rounded bg-brand-100 dark:bg-brand-950 text-brand-700 dark:text-brand-300 truncate" title="${t.title}">
                                    ${t.title}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function renderDayView(container, dateObj) {
            const dateStr = dateObj.toISOString().split('T')[0];
            const dayTasks = getFilteredTasks().filter(t => t.date === dateStr);

            container.innerHTML = `
                <div class="space-y-3">
                    <h3 class="text-sm font-semibold text-slate-500">Actividades programadas para hoy:</h3>
                    ${dayTasks.length === 0 ? '<p class="text-xs text-slate-400">No hay tareas programadas para este día.</p>' : ''}
                    <div class="space-y-2">
                        ${dayTasks.map(t => `
                            <div class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 flex justify-between items-center">
                                <div>
                                    <h4 class="font-bold text-sm">${t.title}</h4>
                                    <span class="text-xs text-slate-400 capitalize">${t.category} • Prioridad ${t.priority}</span>
                                </div>
                                <button onclick="editTask('${t.id}')" class="text-xs px-3 py-1 bg-brand-500 text-white rounded-lg">Ver / Editar</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderYearView(container, year) {
            const months = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
            const filteredTasks = getFilteredTasks();

            let html = `<div class="grid grid-cols-3 sm:grid-cols-4 gap-3">`;

            months.forEach((m, idx) => {
                const count = filteredTasks.filter(t => {
                    const d = new Date(t.date);
                    return d.getFullYear() === year && d.getMonth() === idx;
                }).length;

                html += `
                    <div class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 text-center">
                        <span class="font-bold text-xs block text-slate-600 dark:text-slate-300">${m}</span>
                        <span class="text-lg font-extrabold text-brand-500">${count}</span>
                        <span class="text-[10px] text-slate-400 block">tareas</span>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        // Calendar Controls
        document.getElementById('cal-prev').addEventListener('click', () => {
            if (currentView === 'month') calendarDate.setMonth(calendarDate.getMonth() - 1);
            else if (currentView === 'day') calendarDate.setDate(calendarDate.getDate() - 1);
            else if (currentView === 'year') calendarDate.setFullYear(calendarDate.getFullYear() - 1);
            renderCalendar();
        });

        document.getElementById('cal-next').addEventListener('click', () => {
            if (currentView === 'month') calendarDate.setMonth(calendarDate.getMonth() + 1);
            else if (currentView === 'day') calendarDate.setDate(calendarDate.getDate() + 1);
            else if (currentView === 'year') calendarDate.setFullYear(calendarDate.getFullYear() + 1);
            renderCalendar();
        });

        document.getElementById('cal-today').addEventListener('click', () => {
            calendarDate = new Date();
            renderCalendar();
        });

        const modal = document.getElementById('task-modal');
        const form = document.getElementById('task-form');

        document.getElementById('btn-open-modal').addEventListener('click', () => {
            openModal();
        });

        document.getElementById('btn-close-modal').addEventListener('click', closeModal);
        document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

        function openModal(task = null) {
            tempSubtasks = task ? [...task.subtasks] : [];
            document.getElementById('task-id').value = task ? task.id : '';
            document.getElementById('form-title').value = task ? task.title : '';
            document.getElementById('form-category').value = task ? task.category : 'casa';
            document.getElementById('form-status').value = task ? task.status : 'por-iniciar';
            document.getElementById('form-date').value = task ? task.date : new Date().toISOString().split('T')[0];
            document.getElementById('form-priority').value = task ? task.priority : 'P2';
            document.getElementById('form-urgency').value = task ? task.urgency : 'Media';

            document.getElementById('modal-title').textContent = task ? 'Editar Tarea' : 'Nueva Tarea';
            renderSubtasksList();
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
            form.reset();
        }

        // Subtasks Handling
        document.getElementById('btn-add-subtask').addEventListener('click', () => {
            const input = document.getElementById('subtask-input');
            if (input.value.trim()) {
                tempSubtasks.push({ title: input.value.trim(), completed: false });
                input.value = '';
                renderSubtasksList();
            }
        });

        function renderSubtasksList() {
            const list = document.getElementById('subtasks-list');
            list.innerHTML = tempSubtasks.map((st, idx) => `
                <li class="flex items-center justify-between bg-slate-50 dark:bg-slate-900 p-2 rounded-lg text-xs">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" ${st.completed ? 'checked' : ''} onchange="toggleSubtask(${idx})" class="rounded text-brand-500">
                        <span class="${st.completed ? 'line-through text-slate-400' : ''}">${st.title}</span>
                    </label>
                    <button type="button" onclick="removeSubtask(${idx})" class="text-rose-500"><i class="fa-solid fa-xmark"></i></button>
                </li>
            `).join('');
        }

        function toggleSubtask(idx) {
            tempSubtasks[idx].completed = !tempSubtasks[idx].completed;
            renderSubtasksList();
        }

        function removeSubtask(idx) {
            tempSubtasks.splice(idx, 1);
            renderSubtasksList();
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('task-id').value;
            const newTask = {
                id: id || Date.now().toString(),
                title: document.getElementById('form-title').value.trim(),
                category: document.getElementById('form-category').value,
                status: document.getElementById('form-status').value,
                date: document.getElementById('form-date').value,
                priority: document.getElementById('form-priority').value,
                urgency: document.getElementById('form-urgency').value,
                subtasks: tempSubtasks
            };

            if (id) {
                const index = tasks.findIndex(t => t.id === id);
                tasks[index] = newTask;
            } else {
                tasks.push(newTask);
            }

            saveState();
            closeModal();
        });

        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) openModal(task);
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveState();
        }

        function filterByOverdue() {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('search-input').value = '';
            currentCategory = 'all';
            render();
        }

        function generateGoogleCalendarUrl(task) {
            const title = encodeURIComponent(`[${task.priority}] ${task.title}`);
            const details = encodeURIComponent(`Categoría: ${task.category}\nUrgencia: ${task.urgency}\nEstado: ${task.status}`);
            const dateFormatted = task.date.replace(/-/g, '');
            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${dateFormatted}/${dateFormatted}`;
        }

        function exportToICS() {
            let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//TaskManager Pro//ES\n";
            tasks.forEach(t => {
                const d = t.date.replace(/-/g, '');
                icsContent += "BEGIN:VEVENT\n";
                icsContent += `SUMMARY:[${t.priority}] ${t.title}\n`;
                icsContent += `DESCRIPTION:Categoría: ${t.category} | Urgencia: ${t.urgency}\n`;
                icsContent += `DTSTART;VALUE=DATE:${d}\n`;
                icsContent += `DTEND;VALUE=DATE:${d}\n`;
                icsContent += "END:VEVENT\n";
            });
            icsContent += "END:VCALENDAR";

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'mis_tareas_google_sync.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportToGoogleTasksJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "google_tasks_export.json");
            dlAnchorElem.click();
        }

        // Weekly Alert Button
        document.getElementById('btn-weekly-alert').addEventListener('click', () => {
            const todayStr = new Date().toISOString().split('T')[0];
            const overdue = tasks.filter(t => t.date < todayStr && t.status !== 'terminada');
            if (overdue.length > 0) {
                alert(`⚠️ Alerta Semanal: Tienes ${overdue.length} tarea(s) retrasadas:\n\n` + overdue.map(t => `- ${t.title} (Venció: ${t.date})`).join('\n'));
            } else {
                alert("🎉 ¡Felicidades! No tienes tareas retrasadas esta semana.");
            }
        });

        // Initialize Render
        render();
    </script>
</body>
</html>
